spring:
  application:
    name: bmaas-backend
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bmaas_db}
    username: ${DATABASE_USERNAME:bharatrathore}
    password: ${DATABASE_PASSWORD:Bharat@1425}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
  expiration: 86400000 # 24 hours in milliseconds

# CORS Configuration
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.bmaas: DEBUG
    org.springframework.security: DEBUG
